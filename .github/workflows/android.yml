name: Build Android APK

# YouTube changes constantly and a pinned yt-dlp goes stale within months, so
# the weekly run bumps yt-dlp and rebuilds before the app breaks.
on:
  push:
    # android-app is here so the APK can be built and tested before merging.
    # Drop it once this work lands on main.
    branches: [main, android-app]
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Rebuild even if yt-dlp is already current'
        required: false
        default: 'false'
  schedule:
    - cron: '0 2 * * 1'   # Mondays 02:00 UTC

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bump yt-dlp to the latest release
        id: bump
        run: |
          CURRENT=$(grep -oE 'yt-dlp==[0-9.]+' buildozer.spec | cut -d= -f3)
          LATEST=$(curl -s https://pypi.org/pypi/yt-dlp/json | python -c "import sys,json;print(json.load(sys.stdin)['info']['version'])")
          echo "current=$CURRENT latest=$LATEST"
          if [ "$CURRENT" != "$LATEST" ]; then
            sed -i "s/yt-dlp==[0-9.]*/yt-dlp==$LATEST/" buildozer.spec
            sed -i "s/^yt-dlp==.*/yt-dlp==$LATEST/" requirements.txt
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
          echo "version=$LATEST" >> $GITHUB_OUTPUT

          # A weekly run with no new yt-dlp has nothing to rebuild, and the
          # ffmpeg compile is far too slow to spend on a no-op.
          if [ "${{ github.event_name }}" != "schedule" ] \
             || [ "$CURRENT" != "$LATEST" ] \
             || [ "${{ github.event.inputs.force_update }}" = "true" ]; then
            echo "build=true" >> $GITHUB_OUTPUT
          else
            echo "build=false" >> $GITHUB_OUTPUT
            echo "yt-dlp already current; skipping rebuild."
          fi

      - name: Commit the bump
        if: steps.bump.outputs.changed == 'true' && github.event_name == 'schedule'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Bump yt-dlp to ${{ steps.bump.outputs.version }}"
          git push

      # The ffmpeg recipe compiles from source, so the first build takes
      # roughly 30-60 minutes. Caching makes later runs far quicker.
      - name: Cache buildozer state
        if: steps.bump.outputs.build == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      # Use the official kivy/buildozer image rather than a third-party action.
      # ArtemSBulgakov/buildozer-action fails to build: it adds
      # ppa:openjdk-r/ppa on top of the base image, which is now ubuntu:26.04,
      # a release that PPA does not publish for. The base image already ships
      # openjdk-17-jdk, so the PPA was redundant anyway.
      # The image entrypoint maps the container user to the bind mount's
      # UID/GID, so files it writes stay owned by the runner.
      # Split into separate steps on purpose: this repo's Actions logs are not
      # readable without admin auth, but the jobs API exposes per-step
      # pass/fail publicly. Isolating each stage makes the failure point
      # visible from that API alone.
      - name: Diag - docker present
        if: steps.bump.outputs.build == 'true'
        run: docker --version

      - name: Diag - pull buildozer image
        if: steps.bump.outputs.build == 'true'
        run: docker pull ghcr.io/kivy/buildozer:latest

      - name: Diag - run container (no cache mount)
        if: steps.bump.outputs.build == 'true'
        run: |
          docker run --rm \
            --volume "$PWD":/home/user/hostcwd \
            ghcr.io/kivy/buildozer:latest --version

      - name: Diag - run container (with cache mount)
        if: steps.bump.outputs.build == 'true'
        run: |
          mkdir -p "$HOME/.buildozer"
          docker run --rm \
            --volume "$HOME/.buildozer":/home/user/.buildozer \
            --volume "$PWD":/home/user/hostcwd \
            ghcr.io/kivy/buildozer:latest --version

      - name: Build APK
        if: steps.bump.outputs.build == 'true'
        run: |
          mkdir -p "$HOME/.buildozer"
          docker run --rm \
            --volume "$HOME/.buildozer":/home/user/.buildozer \
            --volume "$PWD":/home/user/hostcwd \
            ghcr.io/kivy/buildozer:latest android debug

      - name: Locate APK
        id: apk
        if: steps.bump.outputs.build == 'true'
        run: |
          APK=$(ls bin/*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "No APK produced in bin/"; ls -la bin/ 2>/dev/null || true; exit 1
          fi
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "Built $APK ($(du -h "$APK" | cut -f1))"

      - uses: actions/upload-artifact@v4
        if: steps.bump.outputs.build == 'true'
        with:
          name: ytdownloader-apk
          path: ${{ steps.apk.outputs.path }}

      # Only main publishes a public Release. Branch builds stop at the
      # uploaded artifact, so an unverified APK is never published.
      - name: Publish release
        if: steps.bump.outputs.build == 'true' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: yt-dlp ${{ steps.bump.outputs.version }} (build ${{ github.run_number }})
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
